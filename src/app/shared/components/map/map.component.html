<div class="map-shell">
    <div
        leaflet
        class="leaflet-host"
        [leafletOptions]="options"
        [leafletLayers]="layers"
        leafletDraw
        [leafletDrawOptions]="drawOptions"
        (leafletMapReady)="onMapReady($event)"
        (leafletDrawEdited)="onDrawEdited()"
    >
        <div [leafletLayer]="drawnItems"></div>
    </div>
</div>
