<div class="uploader-shell">
  <div class="preview-row">
    <img [src]="imgUrl" alt="Foto de perfil" class="preview-image" />
    <div class="field-row">
      <label for="profilePhoto">{{ 'PHOTO' | translate }}</label>
      <input id="profilePhoto" type="file" accept="image/*" (change)="onFileSelected($event)" />
    </div>
  </div>

  <div class="actions-row">
    <button type="button" (click)="upload()" [disabled]="processing">{{ 'UPLOAD' | translate }}</button>
    @if (processing) {
    <span>{{ 'UPLOADING_WAIT' | translate }}</span>
    }
  </div>
</div>
