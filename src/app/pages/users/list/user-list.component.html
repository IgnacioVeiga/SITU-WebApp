<section class="page-shell">
    <app-page-header titleKey="USERS" [subtitle]="getPageSubtitle()">
        <div headerActions class="header-actions">
            <button mat-raised-button color="primary" type="button" (click)="addUser()">
                <mat-icon>person_add</mat-icon>
                {{ 'ADD_USER' | translate }}
            </button>

            <button mat-stroked-button color="primary" type="button" (click)="updatePassword()">
                <mat-icon>password</mat-icon>
                {{ 'UPDATE_PASSWORD' | translate }}
            </button>
        </div>
    </app-page-header>

    <div class="mat-elevation-z8 table-shell">
        <table mat-table [dataSource]="dataSource" class="data-table">
            <ng-container matColumnDef="dni">
                <th mat-header-cell *matHeaderCellDef>DNI</th>
                <td mat-cell *matCellDef="let element">{{ element.dni }}</td>
            </ng-container>

            <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef>Usuario</th>
                <td mat-cell *matCellDef="let element">
                    <div class="user-cell">
                        <img [src]="getProfileImageUrl(element)" (error)="useFallbackProfileImage($event)" alt="Foto de perfil" class="profile-image" />
                        <span class="user-name">{{ element.lastName }} {{ element.firstName }}</span>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef>{{ 'ROLE' | translate }}</th>
                <td mat-cell *matCellDef="let element">
                    <span class="role-chip" [ngClass]="getRoleClass(element.role)">{{ getRoleLabel(element.role) }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element" class="actions-cell">
                    <button mat-icon-button type="button" (click)="editUser(element)" aria-label="Editar usuario">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button type="button" (click)="deleteUser(element.id)" aria-label="Eliminar usuario">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-mdc-row" *matNoDataRow>
                <td class="mat-mdc-cell empty-row" [attr.colspan]="displayedColumns.length">Sin usuarios para mostrar.</td>
            </tr>
        </table>

        <mat-paginator [pageSize]="defaultPageSize" [pageSizeOptions]="[10, 20, 40, 80, 160]" showFirstLastButtons></mat-paginator>
    </div>
</section>
