<div class="dialog-shell">
  <h1 mat-dialog-title>Editar usuario</h1>
  <p class="dialog-hint">{{ user.lastName }} {{ user.firstName }}</p>

  <mat-dialog-content class="dialog-body">
    <section class="dialog-section">
      <h2 class="section-title">Foto de perfil</h2>
      <file-uploader
        [imgUrl]="getProfileImageUrl()"
        [userId]="user.id"
        [dni]="user.dni"
      ></file-uploader>
    </section>

    <section class="dialog-section">
      <h2 class="section-title">Datos principales</h2>
      <div class="dialog-grid-two">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" id="firstName" name="firstName" [(ngModel)]="user.firstName" maxlength="80" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Apellido</mat-label>
          <input matInput type="text" id="lastName" name="lastName" [(ngModel)]="user.lastName" maxlength="80" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>DNI</mat-label>
          <input matInput type="number" id="dni" name="dni" [(ngModel)]="user.dni" min="1" [max]="maxDni" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>{{ 'ROLE' | translate }}</mat-label>
          <mat-select id="role" name="role" [(ngModel)]="user.role">
            @for (option of roleTypes; track option.value) {
              <mat-option [value]="option.value">
                {{ option.label }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </section>

    <p class="dialog-hint">{{ 'CHANGE_ROLE_WARNING' | translate }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button mat-dialog-close type="button">{{ 'CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" [mat-dialog-close]="user" type="button" cdkFocusInitial>{{ 'APPLY' | translate }}</button>
  </mat-dialog-actions>
</div>
