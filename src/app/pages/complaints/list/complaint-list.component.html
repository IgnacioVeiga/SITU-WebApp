<section class="page-shell">
    <app-page-header [titleKey]="getTitleKey()" [subtitle]="getPageSubtitle()"></app-page-header>

    <div class="mat-elevation-z8 table-shell">
        <table mat-table [dataSource]="dataSource" class="data-table">
            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef>{{ 'DATETIME' | translate }}</th>
                <td mat-cell *matCellDef="let element" class="date-cell">{{ element.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
            </ng-container>

            <ng-container matColumnDef="claimant">
                <th mat-header-cell *matHeaderCellDef>{{ 'CLAIM' | translate }}</th>
                <td mat-cell *matCellDef="let element" class="claimant-cell">{{ element.reporter?.fullName || 'Anónimo' }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>{{ 'DESCRIPTION' | translate }}</th>
                <td mat-cell *matCellDef="let element">
                    <span class="state-badge" [ngClass]="getStateClass(element.state)">{{ getStateLabel(element.state) }}</span>
                    <span class="description-text">{{ element.description | truncate:110 }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element" class="actions-cell">
                    <button mat-icon-button type="button" (click)="openComplaint(element.id)" aria-label="Abrir denuncia">
                        <mat-icon>drafts</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-mdc-row" *matNoDataRow>
                <td class="mat-mdc-cell empty-row" [attr.colspan]="displayedColumns.length">Sin denuncias para mostrar.</td>
            </tr>
        </table>

        <mat-paginator [pageSize]="defaultPageSize" [pageSizeOptions]="[10, 20, 40, 80, 160]" showFirstLastButtons></mat-paginator>
    </div>
</section>
