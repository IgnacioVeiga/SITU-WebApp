<section class="page-shell">
    <app-page-header titleKey="DASHBOARD" subtitle="Resumen general del estado operativo"></app-page-header>

    <section class="kpi-grid">
        <article class="card-shell kpi-card">
            <div class="kpi-icon"><mat-icon>campaign</mat-icon></div>
            <div>
                <p class="kpi-value">15</p>
                <p class="kpi-label">Alertas activas</p>
            </div>
        </article>

        <article class="card-shell kpi-card">
            <div class="kpi-icon"><mat-icon>fact_check</mat-icon></div>
            <div>
                <p class="kpi-value">66</p>
                <p class="kpi-label">Denuncias totales</p>
            </div>
        </article>

        <article class="card-shell kpi-card">
            <div class="kpi-icon"><mat-icon>pending_actions</mat-icon></div>
            <div>
                <p class="kpi-value">29</p>
                <p class="kpi-label">Pendientes de revisión</p>
            </div>
        </article>

        <article class="card-shell kpi-card">
            <div class="kpi-icon"><mat-icon>task_alt</mat-icon></div>
            <div>
                <p class="kpi-value">33</p>
                <p class="kpi-label">Cerradas esta semana</p>
            </div>
        </article>
    </section>

    <section class="chart-grid">
        <article class="card-shell chart-card">
            <div class="chart-header">
                <h2>Evolución semanal de alertas</h2>
                <p>Tendencia de los últimos 7 días</p>
            </div>
            <div class="chart-container">
                <canvas #alertChart></canvas>
            </div>
        </article>

        <article class="card-shell chart-card">
            <div class="chart-header">
                <h2>Estado actual de denuncias</h2>
                <p>Distribución por estado</p>
            </div>
            <div class="chart-container">
                <canvas #complaintChart></canvas>
            </div>
        </article>
    </section>
</section>
