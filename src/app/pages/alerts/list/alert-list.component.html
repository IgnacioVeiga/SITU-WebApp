<section class="page-shell">
    <app-page-header titleKey="ALERTS" [subtitle]="getPageSubtitle()">
        <div headerActions>
            <div class="filter-actions">
                <button
                    mat-stroked-button
                    type="button"
                    [class.filter-active]="activeOnly"
                    (click)="setActiveOnly(true)"
                >
                    Activas
                </button>
                <button
                    mat-stroked-button
                    type="button"
                    [class.filter-active]="!activeOnly"
                    (click)="setActiveOnly(false)"
                >
                    Todas
                </button>
            </div>
            <button mat-raised-button color="primary" type="button" (click)="createAlertDialog()" class="header-action">
                <mat-icon>add</mat-icon>
                {{ 'CREATE' | translate }}
            </button>
        </div>
    </app-page-header>

    <div class="mat-elevation-z8 table-shell">
        <table mat-table [dataSource]="dataSource" class="data-table">
            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>{{ 'TITLE' | translate }}</th>
                <td mat-cell *matCellDef="let element" class="title-cell">{{ element.title }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>{{ 'DESCRIPTION' | translate }}</th>
                <td mat-cell *matCellDef="let element">
                    <span class="description-text">{{ element.description | truncate:130 }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="date">
                <th mat-header-cell *matHeaderCellDef>{{ 'DATETIME' | translate }}</th>
                <td mat-cell *matCellDef="let element" class="date-cell">{{ element.alertDate | date: 'dd/MM/yyyy HH:mm' }}</td>
            </ng-container>

            <ng-container matColumnDef="priority">
                <th mat-header-cell *matHeaderCellDef>{{ 'PRIORITY' | translate }}</th>
                <td mat-cell *matCellDef="let element">
                    <span class="priority-chip" [ngClass]="getPriorityClass(element.priority)">
                        {{ getPriorityLabel(element.priority) }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element" class="actions-cell">
                    <button mat-icon-button type="button" (click)="seeAlertDialog(element)" aria-label="Ver detalle de alerta">
                        <mat-icon>visibility</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-mdc-row" *matNoDataRow>
                <td class="mat-mdc-cell empty-row" [attr.colspan]="displayedColumns.length">Sin alertas para mostrar.</td>
            </tr>
        </table>

        <mat-paginator [pageSize]="defaultPageSize" [pageSizeOptions]="[10, 20, 40, 80, 160]" showFirstLastButtons></mat-paginator>
    </div>
</section>
