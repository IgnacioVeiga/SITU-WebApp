<form #updatePasswordForm="ngForm" class="dialog-shell">
  <h1 mat-dialog-title>{{ 'UPDATE_PASSWORD' | translate }}</h1>

  <mat-dialog-content class="dialog-body">
    <mat-form-field>
      <mat-label>{{ 'CURRENT_PASSWORD' | translate }}</mat-label>
      <input matInput type="password" id="currentPassword" name="currentPassword" [(ngModel)]="form.currentPassword" required />
    </mat-form-field>

    <hr class="dialog-divider" />

    <mat-form-field>
      <mat-label>{{ 'NEW_PASSWORD' | translate }}</mat-label>
      <input matInput type="password" id="newPassword" name="newPassword" [(ngModel)]="form.newPassword" required minlength="8" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'REPEAT_PASSWORD' | translate }}</mat-label>
      <input matInput type="password" id="repeatPassword" name="repeatPassword" [(ngModel)]="repeatPassword" required minlength="8" />
    </mat-form-field>

    @if (!passwordsMatch && repeatPassword.length > 0) {
    <div>
      <mat-error>{{ 'PASSWORDS_MUST_MATCH' | translate }}</mat-error>
    </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button type="button" mat-dialog-close [disabled]="isSubmitting">{{ 'CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" type="button" (click)="sendForm()" [disabled]="!updatePasswordForm.valid || !passwordsMatch || isSubmitting">
      {{ 'APPLY' | translate }}
    </button>
  </mat-dialog-actions>
</form>
