<router-outlet></router-outlet>

<button
  type="button"
  class="language-switcher"
  (click)="toggleLanguage()"
  [attr.aria-label]="'Cambiar idioma a ' + nextLanguageLabel"
>
  {{ nextLanguageLabel }}
</button>

@if (isLoading) {
<div class="spinner">
  <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
</div>
}
